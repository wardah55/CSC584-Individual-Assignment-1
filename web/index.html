<!DOCTYPE html>
<html>
<head>
    <title>My Personal Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { 
            width: 100%;
            max-width: 550px; 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.2); 
        }
        h2 { 
            text-align: center; 
            color: #333; 
            margin-bottom: 30px;
            font-weight: 600;
            font-size: 24px;
        }
        .form-group { margin-bottom: 20px; }
        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 8px; 
            color: #555;
            font-size: 14px;
        }
        input[type="text"], input[type="email"], textarea { 
            width: 100%; 
            padding: 12px 15px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }
        input:focus, textarea:focus {
            border-color: #667eea;
            background: #fff;
            outline: none;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
        }
        textarea { resize: vertical; min-height: 100px; }
        button { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(to right, #667eea, #764ba2); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 600;
            cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create Your Profile</h2>
        <form action="ProfileServlet" method="post">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="e.g. John Doe" required>
            </div>
            <div class="form-group">
                <label>Student ID</label>
                <input type="text" name="studentId" placeholder="e.g. 2023123456" required>
            </div>
            <div class="form-group">
                <label>Programme</label>
                <input type="text" name="programme" placeholder="e.g. CS230 - Computer Science" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="john@student.uitm.edu.my" required>
            </div>
            <div class="form-group">
                <label>Hobbies</label>
                <input type="text" name="hobbies" placeholder="e.g. Coding, Gaming, Reading" required>
            </div>
            <div class="form-group">
                <label>Short Self-Introduction</label>
                <textarea name="introduction" placeholder="Tell us a little bit about yourself..." required></textarea>
            </div>
            <button type="submit">Generate Profile</button>
        </form>
    </div>
</body>
</html>
